name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/workshop-tag-filter

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PAPP_VERSION_NAME="tagfilter-${GITHUB_RUN_NUMBER}" \
            -PAPP_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-native-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
