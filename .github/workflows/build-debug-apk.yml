name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName（可选，默认 tagfilter-<run number>）"
        required: false
        type: string
      version_code:
        description: "versionCode（可选，默认 100000+run number）"
        required: false
        type: string
      release_tag:
        description: "release tag（可选，填写后构建完成会自动发布到该 Release）"
        required: false
        type: string
  push:
    branches:
      - fix/workshop-tag-filter

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          VERSION_CODE="${{ inputs.version_code }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="tagfilter-${GITHUB_RUN_NUMBER}"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"; fi
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            -PAPP_VERSION_CODE="$VERSION_CODE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-native-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Workshop Native ${{ inputs.release_tag }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
